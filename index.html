<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Luke's Pressure Washing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;font-family:'Jost',sans-serif;background:linear-gradient(170deg,#0a1f35 0%,#0d2b48 35%,#0e3358 65%,#0a2540 100%);color:#e0f0ff;overflow-x:hidden;}
  #ripple-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.08;}
  header{position:relative;z-index:2;text-align:center;padding:30px 16px 14px;}
  .hcard{display:inline-block;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border-radius:22px;padding:18px 40px 16px;box-shadow:0 8px 40px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.1) inset;border:1px solid rgba(100,180,230,.2);}
  .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1a8fd1,#01467a);margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 22px rgba(0,80,150,.5);transition:transform .3s;}
  .logo:hover{transform:scale(1.09) rotate(-6deg);}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:700;color:#e8f4ff;letter-spacing:.06em;text-transform:uppercase;}
  .tagline{color:#7bbde0;font-size:.78rem;letter-spacing:.18em;margin-top:3px;}
  .hstars{margin-top:7px;font-size:.8rem;color:#7bbde0;}
  nav{position:relative;z-index:2;display:flex;justify-content:center;gap:10px;padding:12px 16px 0;}
  .tbtn{padding:10px 24px;border-radius:30px;border:1px solid rgba(100,180,230,.22);font-family:'Jost',sans-serif;font-size:.88rem;font-weight:500;background:rgba(255,255,255,.07);color:#a8d4f0;cursor:pointer;transition:all .2s;}
  .tbtn.active{background:linear-gradient(135deg,#1a8fd1,#01467a);color:#fff;font-weight:700;border-color:transparent;box-shadow:0 4px 18px rgba(1,70,122,.5);}
  .tbtn:hover:not(.active){background:rgba(255,255,255,.12);color:#d0eaff;}
  main{position:relative;z-index:2;max-width:700px;margin:0 auto;padding:18px 14px 70px;}
  .compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .compare-panel{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .compare-panel img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:center top;}
  .clabel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);border-radius:20px;padding:5px 16px;font-size:.78rem;font-weight:700;letter-spacing:.1em;white-space:nowrap;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.45);}
  .clabel-before{background:rgba(10,15,20,.85);backdrop-filter:blur(4px);color:#fff;}
  .clabel-after{background:linear-gradient(135deg,#1a8fd1,#01467a);color:#fff;}
  .eco-card{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border-radius:14px;padding:13px;text-align:center;border:1px solid rgba(100,180,230,.16);margin-bottom:16px;transition:transform .2s;}
  .eco-card:hover{transform:translateY(-2px);}
  .sicon{font-size:1.4rem;}
  .stitle{color:#cce8ff;font-weight:700;font-size:.78rem;margin-top:3px;}
  .ssub{color:#7bbde0;font-size:.68rem;}
  .sh{font-family:'Cormorant Garamond',serif;color:#cce8ff;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin:0 0 12px;font-weight:700;}
  .cta{display:block;margin:14px auto 0;padding:12px 32px;background:linear-gradient(135deg,#1a8fd1,#01467a);color:#fff;border:none;border-radius:28px;font-family:'Jost',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 18px rgba(1,70,122,.45);transition:transform .18s,box-shadow .18s;}
  .cta:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(1,70,122,.6);}
  .empty{text-align:center;color:#7bbde0;font-style:italic;padding:28px 16px;font-size:.9rem;}
  .rcard{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border-radius:14px;padding:14px 15px;margin-bottom:10px;border:1px solid rgba(100,180,230,.16);animation:fs .35s ease both;}
  @keyframes fs{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .rheader{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .rname{font-weight:700;color:#d0eaff;font-size:.92rem;}
  .rdate{color:#4a6880;font-size:.73rem;}
  .rstars{margin-bottom:4px;}
  .rtext{color:#a8cce4;font-size:.88rem;line-height:1.55;font-style:italic;}
  .fcard{background:rgba(255,255,255,.07);backdrop-filter:blur(16px);border-radius:18px;padding:20px 16px;border:1px solid rgba(100,180,230,.16);margin-bottom:18px;}
  .fi,.ft{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid rgba(100,180,230,.28);font-family:'Jost',sans-serif;font-size:.91rem;background:rgba(255,255,255,.08);color:#e0f0ff;outline:none;transition:border-color .18s;margin-bottom:9px;}
  .fi::placeholder,.ft::placeholder{color:#5a90b0;}
  .fi:focus,.ft:focus{border-color:#1a8fd1;}
  .ft{resize:vertical;min-height:95px;}
  .srow{display:flex;align-items:center;gap:5px;margin-bottom:9px;}
  .srow label{color:#7bbde0;font-size:.83rem;margin-right:2px;}
  .sbtn{font-size:1.75rem;cursor:pointer;color:rgba(100,180,230,.22);background:none;border:none;padding:0;transition:color .12s,transform .1s;line-height:1;}
  .sbtn.lit{color:#f59e0b;}
  .sbtn:hover{transform:scale(1.22);}
  .subbtn{width:100%;padding:12px;background:linear-gradient(135deg,#1a8fd1,#01467a);color:#fff;border:none;border-radius:12px;font-family:'Jost',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 16px rgba(1,70,122,.38);transition:background .3s,transform .15s;}
  .subbtn:hover{transform:translateY(-1px);}
  .subbtn.ok{background:#22c55e;}
  .rch{color:#cce8ff;font-size:.92rem;letter-spacing:.07em;text-transform:uppercase;margin:0 0 10px;font-weight:700;}
  footer{position:relative;z-index:2;text-align:center;padding:16px 16px 26px;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);border-top:1px solid rgba(100,180,230,.13);}
  .fbrand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.97rem;color:#cce8ff;margin-bottom:4px;letter-spacing:.05em;}
  .fcontact{color:#7bbde0;font-size:.86rem;}
  footer a{color:#1a8fd1;text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  .sep{color:#4a6880;margin:0 7px;}
  .panel{animation:fs .28s ease both;}
  .hidden{display:none!important;}
</style>
</head>

    <div class="fcard">
      <input id="inp-name" class="fi" type="text" placeholder="Your name"/>
      <div class="srow">
        <label>Rating:</label>
        <button class="sbtn lit" data-val="1" onclick="setStar(1)">★</button>
        <button class="sbtn lit" data-val="2" onclick="setStar(2)">★</button>
        <button class="sbtn lit" data-val="3" onclick="setStar(3)">★</button>
        <button class="sbtn lit" data-val="4" onclick="setStar(4)">★</button>
        <button class="sbtn lit" data-val="5" onclick="setStar(5)">★</button>
      </div>

      <button class="subbtn" id="subbtn" onclick="submitReview()">Submit Review</button>

<script>
let reviews=JSON.parse(localStorage.getItem('pw_reviews')||'[]');
let sel=5;
function save(){localStorage.setItem('pw_reviews',JSON.stringify(reviews));}
function showTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.remove('hidden');
  btn.classList.add('active');render();
}
function starHTML(n){return[1,2,3,4,5].map(i=>`<span style="color:${i<=n?'#f59e0b':'rgba(100,180,230,.2)'};font-size:.98rem;">★</span>`).join('');}
function cardHTML(r){return`<div class="rcard"><div class="rheader"><span class="rname">${r.name}</span><span class="rdate">${r.date}</span></div><div class="rstars">${starHTML(r.stars)}</div><div class="rtext">&ldquo;${r.comment}&rdquo;</div></div>`;}
function render(){
  const as=document.getElementById('avg-stars'),al=document.getElementById('avg-label');
  if(!reviews.length){as.textContent='—';al.textContent=' No reviews yet';}
  else{
    const avg=(reviews.reduce((a,r)=>a+r.stars,0)/reviews.length).toFixed(1);
    as.innerHTML=`<span style="color:#f59e0b">${'★'.repeat(Math.round(avg))}</span>`;
    al.textContent=` ${avg} (${reviews.length} review${reviews.length!==1?'s':''})`;
  }
  const pv=document.getElementById('preview-reviews');
  pv.innerHTML=reviews.length?reviews.slice(0,3).map(cardHTML).join(''):'<div class="empty">No reviews yet — be the first!</div>';
  const ac=document.getElementById('all-count'),ar=document.getElementById('all-reviews');
  if(!reviews.length){ac.style.display='none';ar.innerHTML='<div class="empty">No reviews yet — be the first!</div>';}
  else{ac.style.display='block';ac.textContent=`All Reviews (${reviews.length})`;ar.innerHTML=reviews.map(cardHTML).join('');}
}
function setStar(v){sel=v;document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('lit',+b.dataset.val<=v));}
function submitReview(){
  const name=document.getElementById('inp-name').value.trim();
  const comment=document.getElementById('inp-comment').value.trim();
  if(!name||!comment){alert('Please enter your name and a comment.');return;}
  const date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  reviews.unshift({name,stars:sel,comment,date});
  save();render();
  document.getElementById('inp-name').value='';
  document.getElementById('inp-comment').value='';
  setStar(5);
  const btn=document.getElementById('subbtn');
  btn.textContent='✓ Thank You! Posted!';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='Submit Review';btn.classList.remove('ok');},3000);
}
render();
</script>
